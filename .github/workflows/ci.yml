name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate dev JWT keys
        run: |
          KEYS=services/auth-service/src/main/resources/keys
          mkdir -p "$KEYS"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$KEYS/jwt-private.pem"
          openssl pkey -in "$KEYS/jwt-private.pem" -pubout -out "$KEYS/jwt-public.pem"

      - name: Generate dev TLS certificates
        run: ./infra/tls/gen-certs.sh

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Build & unit tests
        run: ./gradlew build -x jacocoTestCoverageVerification --no-daemon

      - name: Coverage gate (JaCoCo ≥80% per service)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: '**/build/reports/jacoco/test/html'

      - name: Upload service jars
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            services/*/build/libs/*.jar
            !services/*/build/libs/*-plain.jar
          retention-days: 1
          compression-level: 0

  images:
    name: Image ${{ matrix.service }}
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: api-gateway,          port: 8087 }
          - { service: auth-service,         port: 8086 }
          - { service: user-service,         port: 8082 }
          - { service: product-service,      port: 8083 }
          - { service: inventory-service,    port: 8084 }
          - { service: order-service,        port: 8085 }
          - { service: notification-service, port: 8088 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download service jars
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, without push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          load: true
          push: false
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.service
          build-args: |
            SERVICE=${{ matrix.service }}
            PORT=${{ matrix.port }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}

  deploy-dev:
    name: Deploy dev
    if: github.event_name == 'push'
    needs: images
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to k3d and run smoke tests
        uses: ./.github/actions/k3d-deploy
        with:
          cluster: ci
          namespace: platform
          image-tag: ${{ github.sha }}
          diagnostics-name: k3d-diagnostics-dev

  deploy-prod:
    name: Deploy prod
    if: github.event_name == 'push'
    needs: deploy-dev
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to k3d and run smoke tests
        uses: ./.github/actions/k3d-deploy
        with:
          cluster: prod
          namespace: platform-prod
          image-tag: ${{ github.sha }}
          extra-values: helm/platform/values-prod.yaml
          diagnostics-name: k3d-diagnostics-prod

  security-scan:
    name: Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Ключ с датой → база освежается раз в сутки; restore-keys подтянет вчерашнюю,
      # плагин догрузит только дельту (иначе каждый прогон качал бы всю базу NVD).
      - id: nvddate
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: nvd-${{ runner.os }}-${{ steps.nvddate.outputs.date }}
          restore-keys: nvd-${{ runner.os }}-

      - run: chmod +x gradlew

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/build/reports/dependency-check-report.html'