name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate dev JWT keys
        run: |
          KEYS=services/auth-service/src/main/resources/keys
          mkdir -p "$KEYS"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$KEYS/jwt-private.pem"
          openssl pkey -in "$KEYS/jwt-private.pem" -pubout -out "$KEYS/jwt-public.pem"

      - name: Generate dev TLS certificates
        run: ./infra/tls/gen-certs.sh

      - name: Build & unit tests
        run: ./gradlew build --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build product-service Docker image
        run: |
          docker build \
            -f services/product-service/Dockerfile \
            -t product-service:${{ github.sha }} \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: product-service:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'
          trivyignores: .trivyignore

  security-scan:
    name: Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Ключ с датой → база освежается раз в сутки; restore-keys подтянет вчерашнюю,
      # плагин догрузит только дельту (иначе каждый прогон качал бы всю базу NVD).
      - id: nvddate
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .dependency-check-data
          key: nvd-${{ runner.os }}-${{ steps.nvddate.outputs.date }}
          restore-keys: nvd-${{ runner.os }}-

      - run: chmod +x gradlew

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --no-daemon

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: '**/build/reports/dependency-check-report.html'