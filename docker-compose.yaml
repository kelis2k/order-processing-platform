# Event-Driven Order Processing Platform — локальная инфраструктура (шаг 1.2)
# Apache Kafka (KRaft, без ZooKeeper) — КЛАСТЕР ИЗ 3 БРОКЕРОВ + Confluent Schema
# Registry, PostgreSQL (отдельный контейнер на сервис), MongoDB (replica set),
# Redis, MailHog.
#
# Запуск:    docker compose up -d
# Остановка: docker compose down            (данные сохраняются в volume'ах)
# Сброс:     docker compose down -v          (УДАЛИТ все данные)
#
# ВНИМАНИЕ по ресурсам: 3 брокера Kafka на JVM + 4 Postgres + Mongo + Redis + UI.
# Закладывай минимум 8-10 GB свободной RAM, комфортно — 16+.

name: order-platform

# =============================================================================
# YAML-анкоры: общие куски конфигурации брокеров, чтобы не дублировать.
# =============================================================================
x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  environment: &kafka-common-env
    # Кворум контроллеров: все три узла — голосующие контроллеры.
    KAFKA_PROCESS_ROLES: "broker,controller"
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093"
    KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    # Единый cluster id для всех узлов одного кластера.
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
    # Кластер из 3 узлов — служебные топики живут с фактором репликации 3.
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  networks: [backend]

x-service-common-env: &service-common-env
  JAVA_TOOL_OPTIONS: "-javaagent:/otel/agent.jar -XX:MaxRAMPercentage=50"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_JAVAAGENT_ENABLED: ${OTEL_ENABLED:-true}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
  KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
  KAFKA_BOOTSTRAP: kafka-1:29092,kafka-2:29092,kafka-3:29092
  SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  AUTH_JWKS_URI: http://auth-service:8086/.well-known/jwks.json

services:
  # ---------------------------------------------------------------------------
  # Kafka — кластер из 3 брокеров в combined-режиме (broker + controller).
  # KRaft: без ZooKeeper. Каждый узел — и брокер, и контроллер.
  # EXTERNAL listener'ы маппятся на хост на разные порты: 9092 / 9093 / 9094.
  # ---------------------------------------------------------------------------
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:29092,EXTERNAL://localhost:9093"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:29092,EXTERNAL://localhost:9094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9094"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Confluent Schema Registry — реестр Avro-схем. Подключается ко всем брокерам.
  # ---------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-1:29092,PLAINTEXT://kafka-2:29092,PLAINTEXT://kafka-3:29092"
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: "BACKWARD"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Kafka UI — топики, сообщения, схемы, состояние кластера (3 брокера).
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      schema-registry:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:29092,kafka-2:29092,kafka-3:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [backend]

  # ---------------------------------------------------------------------------
  # PostgreSQL — ОТДЕЛЬНЫЙ контейнер на каждый сервис (строгий database-per-service).
  # Сервисы на PG: auth, user, order, inventory.
  # product -> Mongo (product_db), notification -> Mongo (notification_db).
  # Порты на хосте: 5432 / 5433 / 5434 / 5435.
  # ---------------------------------------------------------------------------
  postgres-auth:
    image: postgres:15.7-alpine
    container_name: postgres-auth
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  postgres-user:
    image: postgres:15.7-alpine
    container_name: postgres-user
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user_svc
      POSTGRES_PASSWORD: user_svc
      POSTGRES_DB: user_db
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_svc -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  postgres-order:
    image: postgres:15.7-alpine
    container_name: postgres-order
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: order_svc
      POSTGRES_PASSWORD: order_svc
      POSTGRES_DB: order_db
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_svc -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  postgres-inventory:
    image: postgres:15.7-alpine
    container_name: postgres-inventory
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: inventory_svc
      POSTGRES_PASSWORD: inventory_svc
      POSTGRES_DB: inventory_db
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_svc -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

  # ---------------------------------------------------------------------------
  # MongoDB — single-node replica set (rs0) для product-service.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [backend]

  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["bash", "/init/rs-init.sh"]
    volumes:
      - ./infra/mongo-init:/init:ro
    restart: "no"
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Redis — кэш / идемпотентность / rate-limit.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  # ---------------------------------------------------------------------------
  # product-service — каталог товаров (Spring Boot, MongoDB).
  # Собирается из исходников monorepo при docker compose up --build.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Наши микросервисы. Все семь собираются одним infra/docker/Dockerfile.service
  # (различаются build-arg SERVICE/PORT). JAR'ы собираются на хосте: make build-jars.
  # OpenTelemetry-агент монтируется томом, выключается через OTEL_ENABLED=false.
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: auth-service
        PORT: 8086
    container_name: auth-service
    depends_on:
      postgres-auth: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports:
      - "8086:8086"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      APP_JWT_PRIVATE_KEY: file:/keys/jwt-private.pem
      APP_JWT_PUBLIC_KEY: file:/keys/jwt-public.pem
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
      - ./.secrets/dev/jwt:/keys:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  user-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: user-service
        PORT: 8082
    container_name: user-service
    depends_on:
      postgres-user: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports:
      - "8082:8082"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: user-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: user_svc
      SPRING_DATASOURCE_PASSWORD: user_svc
      ADMIN_EMAIL: admin@orders.local
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  product-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: product-service
        PORT: 8083
    container_name: product-service
    depends_on:
      mongo: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      redis: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports:
      - "8083:8083"
      - "9089:9089"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: product-service
      MONGO_URI: mongodb://mongo:27017/product_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TLS_DIR: /tls
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
      - ./.secrets/dev/tls:/tls:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  inventory-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: inventory-service
        PORT: 8084
    container_name: inventory-service
    depends_on:
      postgres-inventory: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
    ports:
      - "8084:8084"
      - "9090:9090"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: inventory-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_svc
      SPRING_DATASOURCE_PASSWORD: inventory_svc
      TLS_DIR: /tls
      AUTH_JWKS_URI: http://auth-service:8086/.well-known/jwks.json
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
      - ./.secrets/dev/tls:/tls:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  order-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: order-service
        PORT: 8085
    container_name: order-service
    depends_on:
      postgres-order: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      inventory-service: { condition: service_started }
    ports:
      - "8085:8085"
      - "9091:9091"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: order-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_svc
      SPRING_DATASOURCE_PASSWORD: order_svc
      GRPC_CLIENT_INVENTORY_ADDRESS: static://inventory-service:9090
      GRPC_CLIENT_PRODUCT_ADDRESS: static://product-service:9089
      TLS_DIR: /tls
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
      - ./.secrets/dev/tls:/tls:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  notification-service:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: notification-service
        PORT: 8088
    container_name: notification-service
    depends_on:
      mongo: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
      redis: { condition: service_healthy }
      schema-registry: { condition: service_healthy }
      mailhog: { condition: service_started }
    ports:
      - "8088:8088"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: notification-service
      MONGO_URI: mongodb://mongo:27017/notification_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: no-reply@orders.local
      APP_PUBLIC_URL: http://localhost:8087
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  api-gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: api-gateway
        PORT: 8087
    container_name: api-gateway
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }
    ports:
      - "8087:8087"
    environment:
      <<: *service-common-env
      OTEL_SERVICE_NAME: api-gateway
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_URI: http://auth-service:8086
      USER_URI: http://user-service:8082
      PRODUCT_URI: http://product-service:8083
      ORDER_URI: http://order-service:8085
      INVENTORY_URI: http://inventory-service:8084
    volumes:
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/agent.jar:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [backend]

  # ---------------------------------------------------------------------------
  # MailHog — фейковый SMTP + веб-инбокс для notification-service.
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks: [backend]

  # ---------------------------------------------------------------------------
  # kafka-exporter — broker-side consumer lag (Шаг 7.2).
  # Спрашивает у брокеров committed vs end offset → kafka_consumergroup_lag.
  # Надёжнее client-side метрики (та NaN в покое и исчезает при падении консьюмера).
  # ---------------------------------------------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    command:
      - '--kafka.server=kafka-1:29092'
      - '--kafka.server=kafka-2:29092'
      - '--kafka.server=kafka-3:29092'
    ports:
      - "9308:9308"
    depends_on:
      kafka-1:
        condition: service_healthy
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Prometheus — сбор метрик со всех сервисов (Шаг 7.2).
  # product-service — по имени в сети backend; остальные 6 запускаются на хосте
  # (IntelliJ / java -jar) → host.docker.internal. В k8s (Этап 9) станет единообразно.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9099:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # wsl-host → IP WSL2-дистрибутива, где идут хостовые сервисы (java -jar / IntelliJ).
      # host.docker.internal (Docker Desktop) до сервисов в WSL2 НЕ достаёт — нужен IP eth0 WSL.
      # ⚠️ IP динамический: меняется при перезапуске WSL (`wsl --shutdown`) — обновить `hostname -I`.
      - "wsl-host:172.21.156.231"
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9095:9093"
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Loki — хранилище логов (Шаг 7.3). Single-binary, filesystem-storage.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Promtail — тейлит JSON-логи сервисов из ./logs и шлёт в Loki (Шаг 7.3).
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on: [loki]
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ./logs:/var/log/app:ro
      - promtail-positions:/promtail
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Grafana — визуализация метрик из Prometheus (Шаг 7.2).
  # Datasource прокидывается provisioning'ом — руками источник настраивать не надо.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [backend]

  # ---------------------------------------------------------------------------
  # Jaeger — приём/хранение/визуализация трейсов (Шаг 7.4). All-in-one.
  # Принимает OTLP напрямую (агенту не нужен отдельный collector).
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks: [backend]

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  postgres-auth-data:
  postgres-user-data:
  postgres-order-data:
  postgres-inventory-data:
  mongo-data:
  redis-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:


networks:
  backend:
    driver: bridge
