apiVersion: v2
name: platform
description: Umbrella chart для Event-Driven Order Processing Platform (k3d)
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: api-gateway
    condition: api-gateway.enabled
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: auth-service
    condition: auth-service.enabled
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: user-service
    condition: user-service.enabled
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: product-service
    condition: product-service.enabled
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: inventory-service
    condition: inventory-service.enabled
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: order-service
    condition: order-service.enabled
  - name: microservice
    version: "0.1.0"
    repository: "file://../microservice"
    alias: notification-service
    condition: notification-service.enabled
