{{- if .Values.infra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels: { app.kubernetes.io/name: mailhog }
spec:
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
  selector: { app.kubernetes.io/name: mailhog }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailhog }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailhog }
    spec:
      enableServiceLinks: false
      containers:
        - name: mailhog
          image: {{ .Values.infra.mailhog.image }}
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          resources:
            requests: { cpu: 25m,  memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
{{- end }}