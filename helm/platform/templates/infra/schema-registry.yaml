{{- if .Values.infra.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels: { app.kubernetes.io/name: schema-registry }
spec:
  ports:
    - { name: http, port: 8081, targetPort: http }
  selector: { app.kubernetes.io/name: schema-registry }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: schema-registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: schema-registry }
    spec:
      containers:
        - name: schema-registry
          image: {{ .Values.infra.schemaRegistry.image }}
          ports:
            - { name: http, containerPort: 8081 }
          env:
            - { name: SCHEMA_REGISTRY_HOST_NAME, value: "schema-registry" }
            - { name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka:9092" }
            - { name: SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL, value: "BACKWARD" }
            - { name: SCHEMA_REGISTRY_HEAP_OPTS, value: {{ .Values.infra.schemaRegistry.heapOpts | quote }} }
          readinessProbe:
            httpGet: { path: /subjects, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 500m, memory: 640Mi }
{{- end }}