server:
  port: 8088

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/notification_db}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}

app:
  mail:
    from: ${MAIL_FROM:no-reply@orders.local}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:5}
    window-ms: ${RATE_LIMIT_WINDOW_MS:60000}
  kafka:
    consumer:
      retry:
        initial-interval-ms: 1000
        multiplier: 2.0
        max-interval-ms: 10000
        max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
