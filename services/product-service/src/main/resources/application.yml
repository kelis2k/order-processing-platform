server:
  port: 8083

spring:
  application:
    name: product-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/.well-known/jwks.json}

  data:
    mongodb:
      # В Docker переопределяется env var MONGO_URI (см. docker-compose.yaml)
      uri: ${MONGO_URI:mongodb://localhost:27017/product_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}

grpc:
  server:
    port: 9089
    security:
      enabled: true
      certificate-chain: file:${TLS_DIR:.secrets/dev/tls}/product-server.crt
      private-key: file:${TLS_DIR:.secrets/dev/tls}/product-server.key
      protocols: TLSv1.3
      client-auth: REQUIRE
      trust-cert-collection: file:${TLS_DIR:.secrets/dev/tls}/ca.crt

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method