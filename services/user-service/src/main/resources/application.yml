server:
  port: 8082

spring:
  application:
    name: user-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/.well-known/jwks.json}
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: user_svc
    password: user_svc
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    hibernate:
    ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
    properties:
      schema.registry.url: http://localhost:8081

app:
  kafka:
    topic:
      replicas: 3
  outbox:
    poll-interval-ms: 1000
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
